version: "3.9"

services:
  api:
    image: iamreinaldo/calendario-copa:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    deploy:
      replicas: 1

  worker:
    image: iamreinaldo/calendario-copa:latest
    command: python -m app.worker
    env_file:
      - .env
    deploy:
      replicas: 1

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: copa2026
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: